<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<title>ZCode</title>
<link rel="manifest" href="./manifest.webmanifest?v=3">
<link rel="icon" href="./icon-192-v2.png">
<link rel="apple-touch-icon" href="./icon-192-v2.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0f1115; color: #e6e9ef;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    overscroll-behavior: none;
  }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; }
  .btn {
    display: block; width: 100%; padding: 14px 16px; margin-top: 12px;
    background: #1c2733; color: #e6e9ef; font-size: 16px; text-align: center;
  }
  .btn:active { filter: brightness(1.2); }
  .btn.primary { background: #146c43; color: #fff; }
  .btn.danger { background: #3a1d21; color: #ff8f8f; }
  input {
    width: 100%; padding: 13px 14px; margin-top: 12px; font-size: 15px;
    background: #171b22; border: 1px solid #2a3140; border-radius: 12px; color: #e6e9ef;
  }
  /* ---------- 配置页 ---------- */
  #setup {
    position: fixed; inset: 0; display: none; flex-direction: column;
    justify-content: center; padding: 28px; max-width: 520px; margin: 0 auto;
  }
  #setup.show { display: flex; }
  .logo { width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 18px; display: block; }
  h1 { font-size: 22px; text-align: center; font-weight: 700; }
  .sub { color: #8b93a3; font-size: 14px; line-height: 1.7; text-align: center; margin: 10px 0 22px; }
  .hint { color: #6b7280; font-size: 12.5px; line-height: 1.8; margin-top: 20px; text-align: center; }
  /* ---------- 任务窗口 ---------- */
  #app { position: fixed; inset: 0; display: none; }
  #app.show { display: block; }
  #frame {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #0f1115;
  }
  body.mini #frame {
    inset: auto; left: auto; top: auto;
    border-radius: 14px; box-shadow: 0 4px 22px rgba(0,0,0,.55);
    outline: 1px solid rgba(255,255,255,.14);
    transform-origin: 0 0;
    pointer-events: none;
  }
  /* 迷你窗的点击层：点它展开 */
  #miniHit { position: fixed; display: none; z-index: 12; border-radius: 14px; }
  body.mini #miniHit { display: block; }
  #miniTag { display: none; }
  /* 展开态右上角小按钮排 */
  #topChips {
    position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 8px;
    display: none; gap: 8px; z-index: 11;
  }
  body:not(.mini) #topChips { display: flex; }
  #topChips button {
    width: 38px; height: 38px; border-radius: 50%; font-size: 16px; line-height: 1;
    background: rgba(15,17,21,.6); color: #dfe6ee; backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.12);
  }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0f1115; z-index: 5; transition: opacity .3s; flex-direction: column; gap: 14px;
  }
  /* 遮挡 ZCode 页面自带的“当前执行步骤”悬浮条（跨域无法删除，用同色贴纸盖住） */
  #todoPatch { position: fixed; display: none; background: #0f1115; border-radius: 14px; z-index: 9; }
  body.patch-on:not(.mini) #todoPatch { display: block; }
  #loading.hide { opacity: 0; pointer-events: none; }
  .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #2a3140; border-top-color: #22c55e; animation: s 1s linear infinite;
  }
  @keyframes s { to { transform: rotate(360deg); } }
  /* ---------- 底部设置面板（长按迷你窗呼出） ---------- */
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #151a21; border-top: 1px solid #2a3140;
    border-radius: 18px 18px 0 0; padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s ease; max-width: 560px; margin: 0 auto;
  }
  #sheet.show { transform: translateY(0); }
  #sheet .cur {
    font-size: 12.5px; color: #8b93a3; word-break: break-all; line-height: 1.6;
    background: #171b22; border: 1px solid #2a3140; border-radius: 10px; padding: 10px 12px;
  }
  #sheet h3 { font-size: 15px; margin-bottom: 10px; }
  .row2 { display: flex; gap: 10px; }
  .row2 .btn { margin-top: 10px; }
  #mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 15; display: none;
  }
  #mask.show { display: block; }
  /* ---------- 扫码 ---------- */
  #cam { position: fixed; inset: 0; z-index: 30; background: #000; display: none; }
  #cam.show { display: block; }
  #cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #cam .top {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center; color: #fff; font-size: 14px; text-shadow: 0 1px 4px #000;
  }
  #cam .box {
    position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%);
    width: 72vw; height: 72vw; max-width: 300px; max-height: 300px;
    border: 2px solid rgba(34,197,94,.9); border-radius: 16px;
  }
  #cam .close {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(30px + env(safe-area-inset-bottom)); padding: 12px 34px;
    background: rgba(255,255,255,.14); color: #fff; font-size: 15px;
  }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: #222b36; color: #e6e9ef; font-size: 13.5px; padding: 10px 16px;
    border-radius: 10px; z-index: 40; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 84vw; text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- 配置页 -->
<div id="setup">
  <img class="logo" src="./icon-192-v2.png" alt="">
  <h1>ZCode</h1>
  <button class="btn primary" id="btnScan">📷 扫码配置</button>
  <input id="urlInput" type="url" placeholder="或粘贴远程控制链接" autocomplete="off" spellcheck="false">
  <button class="btn" id="btnSave">保存并进入</button>
  <button class="btn primary" id="btnBack" style="display:none">↩ 返回任务窗口</button>
</div>

<!-- 任务窗口 -->
<div id="app">
  <iframe id="frame" title="remote" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  <div id="todoPatch" title=""></div>
  <div id="miniHit" title="点击展开任务窗口"></div>
  <div id="topChips">
    <button id="chipPic" title="传图">📷</button>
    <button id="chipMin" title="缩小到右上角">–</button>
  </div>
  <div id="loading"><div class="spin"></div><div style="color:#8b93a3;font-size:13px" id="loadText">正在连接工作区…</div></div>
</div>

<!-- 设置面板 -->
<div id="mask"></div>
<div id="sheet">
  <div class="row2">
    <button class="btn" id="btnScan2" style="margin-top:10px">📷 重新扫码</button>
    <button class="btn" id="btnPaste2" style="margin-top:10px">📋 粘贴链接</button>
  </div>
  <div class="row2">
    <button class="btn" id="btnSendPic" style="margin-top:10px">📷 传图</button>
    <button class="btn" id="btnPatch" style="margin-top:10px">🙈 遮任务条：关</button>
  </div>
  <h3 style="margin-top:16px">会话页缩放</h3>
  <div class="row2">
    <button class="btn" id="zoomOut" style="margin-top:8px">－ 缩小</button>
    <button class="btn" id="zoomValBtn" style="margin-top:8px; min-width:76px">100%</button>
    <button class="btn" id="zoomIn" style="margin-top:8px">＋ 放大</button>
  </div>
</div>

<!-- 扫码 -->
<div id="cam">
  <video id="video" playsinline muted></video>
  <div class="top">对准电脑屏幕上的二维码</div>
  <div class="box"></div>
  <button class="close" id="btnCamClose">取消</button>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';
  var KEY_URL = 'zc_target_url';
  var KEY_ZOOM = 'zc_zoom';
  var $ = function (id) { return document.getElementById(id); };
  var setup = $('setup'), app = $('app'), frame = $('frame'),
      loading = $('loading'), sheet = $('sheet'), mask = $('mask'),
      cam = $('cam'), video = $('video'), toastEl = $('toast'),
      miniHit = $('miniHit');

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  function validUrl(v) {
    try {
      var u = new URL(v.trim());
      return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : null;
    } catch (e) { return null; }
  }

  function getSaved() { return localStorage.getItem(KEY_URL) || ''; }

  /* ---------- 迷你窗 / 展开态 ---------- */
  var MINI_W = 92;                        // 迷你窗宽度(px)，贴右
  var isMini = false;

  function layoutMini() {
    var k = MINI_W / window.innerWidth;   // 等比缩到宽度=92
    var mh = Math.round(window.innerHeight * k);
    var mtop = 6;
    var left = window.innerWidth - MINI_W - 5;
    frame.style.width = window.innerWidth + 'px';
    frame.style.height = window.innerHeight + 'px';
    frame.style.transform = 'scale(' + k + ')';
    frame.style.transformOrigin = '0 0';
    frame.style.left = left + 'px';
    frame.style.top = mtop + 'px';
    miniHit.style.left = (left - 2) + 'px';
    miniHit.style.top = (mtop - 2) + 'px';
    miniHit.style.width = (MINI_W + 4) + 'px';
    miniHit.style.height = (mh + 4) + 'px';
  }

  function setMini(on) {
    isMini = on;
    document.body.classList.toggle('mini', on);
    if (on) {
      layoutMini();
    } else {
      frame.style.left = '0';
      frame.style.top = '0';
      frame.style.right = '0';
      frame.style.bottom = '0';
      frame.style.width = '100%';
      frame.style.height = '100%';
      frame.style.transformOrigin = '0 0';
      applyZoom(zoomVal, false);          // 恢复用户缩放
    }
  }
  window.addEventListener('resize', function () { if (isMini) layoutMini(); });
  miniHit.addEventListener('click', function () { setMini(false); });
  $('chipMin').addEventListener('click', function () { setMini(true); });

  /* ---------- 进入任务 ---------- */
  function enter(url) {
    if (!url) {
      app.classList.remove('show');
      setup.classList.add('show');
      // 有已保存链接时给一条“返回任务窗口”的退路，避免卡在配对页
      $('btnBack').style.display = getSaved() ? 'block' : 'none';
      return;
    }
    setup.classList.remove('show');
    app.classList.add('show');
    loading.classList.remove('hide');
    $('loadText').textContent = '正在连接工作区…';
    frame.src = url;
    setMini(false);                        // 进来先是完整任务窗口
  }

  frame.addEventListener('load', function () {
    if (frame.src && frame.src !== 'about:blank') loading.classList.add('hide');
  });

  function save(url, andEnter) {
    localStorage.setItem(KEY_URL, url);
    if (andEnter !== false) enter(url);
  }

  /* ---------- ?url= 一键配置 ---------- */
  try {
    var q = new URLSearchParams(location.search).get('url');
    if (q && validUrl(q)) { save(validUrl(q)); history.replaceState(null, '', location.pathname); }
  } catch (e) {}

  /* ---------- 扫码 ---------- */
  var stream = null, rafId = null, detector = null, canvas = null, detFails = 0;

  function stopCam() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    cam.classList.remove('show');
  }

  function onQR(text) {
    stopCam();
    var u = validUrl(text);
    if (!u) { toast('二维码里不是有效网址：' + text.slice(0, 40)); return; }
    save(u);
    toast('已保存链接');
  }

  function scanLoop() {
    if (!stream) return;
    var step = function () {
      if (!stream) return;
      if (detector) {
        detector.detect(video).then(function (codes) {
          if (codes && codes.length) return onQR(codes[0].rawValue);
          rafId = requestAnimationFrame(step);
        }).catch(function () {
          detFails++;
          if (detFails > 8 && window.jsQR) detector = null;   // 检测器异常时降级到 jsQR
          rafId = requestAnimationFrame(step);
        });
      } else if (window.jsQR) {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas = canvas || document.createElement('canvas');
          var w = 480, h = Math.round(video.videoHeight / video.videoWidth * 480) || 360;
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, 0, 0, w, h);
          try {
            var img = ctx.getImageData(0, 0, w, h);
            var code = window.jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
            if (code && code.data) return onQR(code.data);
          } catch (e) {}
        }
        rafId = requestAnimationFrame(step);
      } else {
        rafId = requestAnimationFrame(step);
      }
    };
    rafId = requestAnimationFrame(step);
  }

  async function startScan() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast('此浏览器不支持摄像头（电脑上没有摄像头，请用手机扫码，或粘贴链接）'); return;
    }
    if ('BarcodeDetector' in window) {
      try { detector = new window.BarcodeDetector({ formats: ['qr_code'] }); detFails = 0; }
      catch (e) { detector = null; }
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 1280 } },
        audio: false
      });
    } catch (e) {
      var name = (e && e.name) || '';
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError')
        toast('相机权限被拒绝：点地址栏左侧 🔒 → 权限 → 相机 → 允许，再重试');
      else if (name === 'NotFoundError' || name === 'OverconstrainedError')
        toast('没找到可用摄像头（电脑端没有摄像头，请用手机扫码，或粘贴链接）');
      else
        toast('摄像头打开失败：' + (name || '未知错误') + '，可用粘贴方式');
      return;
    }
    video.srcObject = stream;
    await video.play().catch(function () {});
    cam.classList.add('show');
    if (!detector && !window.jsQR) toast('此浏览器扫码能力不可用，请用粘贴方式');
    scanLoop();
  }

  $('btnScan').addEventListener('click', startScan);
  $('btnScan2').addEventListener('click', startScan);
  $('btnCamClose').addEventListener('click', stopCam);

  /* ---------- 粘贴 ---------- */
  function pasteFlow() {
    var v = prompt('粘贴电脑端「移动端远程控制」的最新链接：', getSaved());
    if (v === null) return;
    var u = validUrl(v);
    if (!u) { toast('链接格式不对'); return; }
    save(u);
    closeSheet();
    toast('已保存并重新连接');
  }
  $('btnPaste2').addEventListener('click', function () { closeSheet(); pasteFlow(); });
  $('btnSave').addEventListener('click', function () {
    var v = validUrl($('urlInput').value);
    if (!v) { toast('请粘贴正确的链接'); return; }
    save(v);
  });
  $('btnBack').addEventListener('click', function () {
    var u = getSaved();
    if (u) enter(u);
  });

  /* ---------- 设置面板（长按迷你窗呼出） ---------- */
  function openSheet() { sheet.classList.add('show'); mask.classList.add('show'); }
  function closeSheet() { sheet.classList.remove('show'); mask.classList.remove('show'); }
  mask.addEventListener('click', closeSheet);
  // 长按迷你窗（或右键）呼出设置
  var lpTimer = null;
  function miniLongPressStart(e) {
    lpTimer = setTimeout(function () { lpTimer = null; openSheet(); }, 650);
  }
  function miniLongPressCancel() { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } }
  miniHit.addEventListener('touchstart', miniLongPressStart, { passive: true });
  miniHit.addEventListener('touchend', miniLongPressCancel);
  miniHit.addEventListener('touchmove', miniLongPressCancel);
  miniHit.addEventListener('contextmenu', function (e) { e.preventDefault(); miniLongPressCancel(); openSheet(); });

  /* ---------- 📷 传图到对话：选图/拍照 → 图床 → 复制链接 ---------- */
  function pickAndUploadImage() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = function () {
      if (inp.files && inp.files[0]) uploadImage(inp.files[0]);
    };
    inp.click();
  }
  function uploadImage(file) {
    toast('正在上传图片（' + Math.max(1, Math.round(file.size / 1024)) + ' KB）…');
    var hosts = [
      function () {   // tmpfiles.org（1小时有效）
        var fd = new FormData();
        fd.append('file', file, file.name || 'image.jpg');
        return fetch('https://tmpfiles.org/api/v1/upload', { method: 'POST', body: fd })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (j && j.status === 'success' && j.data && j.data.url)
              return j.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
            throw new Error('tmpfiles failed');
          });
      },
      function () {   // sm.ms 图床
        var fd = new FormData();
        fd.append('smfile', file, file.name || 'image.jpg');
        return fetch('https://sm.ms/api/v2/upload', { method: 'POST', body: fd })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (j && j.success && j.data && j.data.url) return j.data.url;
            throw new Error((j && j.message) || 'sm.ms failed');
          });
      },
      function () {   // catbox.moe（永久）
        var fd = new FormData();
        fd.append('reqtype', 'fileupload');
        fd.append('fileToUpload', file, file.name || 'image.jpg');
        return fetch('https://catbox.moe/user/api.php', { method: 'POST', body: fd })
          .then(function (r) { return r.text(); })
          .then(function (t) {
            if (/^https?:\/\/files\.catbox\.moe\//.test(t.trim())) return t.trim();
            throw new Error('catbox failed');
          });
      }
    ];
    var i = 0;
    (function next() {
      if (i >= hosts.length) {
        toast('❌ 图床都连不上。可先把图发到微信「文件传输助手」，在电脑端保存进工作区。');
        return;
      }
      hosts[i++]().then(function (url) { deliverUrl(url); }).catch(function () { next(); });
    })();
  }
  async function deliverUrl(url) {
    var msg = '请把这张图片下载到工作区并查看：' + url;
    try {
      await navigator.clipboard.writeText(msg);
      toast('✅ 图片链接已复制！去对话输入框粘贴发送即可');
    } catch (e) {
      window.prompt('上传成功！复制下面整段内容，粘贴到对话里发送：', msg);
    }
  }
  $('chipPic').addEventListener('click', pickAndUploadImage);
  $('btnSendPic').addEventListener('click', pickAndUploadImage);

  /* ---------- 🙈 悬浮任务条遮挡（贴纸式，开关记忆） ---------- */
  var KEY_PATCH = 'zc_patch';
  var patch = $('todoPatch'), btnPatch = $('btnPatch');
  function layoutPatch() {
    // 盖住 ZCode 页顶部“当前执行步骤”悬浮条（几乎全屏宽）
    patch.style.top = '150px';
    patch.style.left = '4vw';
    patch.style.width = '92vw';
    patch.style.height = '56px';
  }
  function applyPatch() {
    var on = localStorage.getItem(KEY_PATCH) === '1';
    document.body.classList.toggle('patch-on', on);
    btnPatch.textContent = on ? '🙈 遮任务条：开' : '🙈 遮任务条：关';
    if (on) layoutPatch();
  }
  btnPatch.addEventListener('click', function () {
    var on = localStorage.getItem(KEY_PATCH) === '1';
    localStorage.setItem(KEY_PATCH, on ? '0' : '1');
    applyPatch();
    toast(on ? '已取消遮挡（该区域恢复显示）' : '已遮挡悬浮任务条（注意：该区域下方内容也会被盖住）');
    closeSheet();
  });
  window.addEventListener('resize', function () {
    if (localStorage.getItem(KEY_PATCH) === '1') layoutPatch();
  });

  /* ---------- 会话页等比缩放（50%–100%，记忆，仅完整窗口生效） ---------- */
  var zoomVal = parseFloat(localStorage.getItem(KEY_ZOOM) || '1');
  if (!(zoomVal >= 0.5 && zoomVal <= 1)) zoomVal = 1;
  function applyZoom(v, keep) {
    zoomVal = Math.min(1, Math.max(0.5, Math.round(v * 20) / 20));
    if (zoomVal === 1) {
      frame.style.transform = '';
      frame.style.width = '100%';
      frame.style.height = '100%';
    } else {
      frame.style.transformOrigin = '0 0';
      frame.style.transform = 'scale(' + zoomVal + ')';
      frame.style.width = (100 / zoomVal) + '%';
      frame.style.height = (100 / zoomVal) + '%';
    }
    $('zoomValBtn').textContent = Math.round(zoomVal * 100) + '%';
    if (keep !== false) { try { localStorage.setItem(KEY_ZOOM, String(zoomVal)); } catch (err) {} }
  }
  $('zoomOut').addEventListener('click', function () { applyZoom(zoomVal - 0.05); });
  $('zoomIn').addEventListener('click', function () { applyZoom(zoomVal + 0.05); });
  $('zoomValBtn').addEventListener('click', function () { applyZoom(1); });

  /* ---------- 启动 ---------- */
  enter(getSaved());
  applyZoom(zoomVal, false);
  applyPatch();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
})();
</script>
<!-- jsQR 兜底（若文件存在）；老安卓 Chrome 无 BarcodeDetector 时使用 -->
<script src="./jsqr.js" onerror="this.remove()"></script>
</body>
